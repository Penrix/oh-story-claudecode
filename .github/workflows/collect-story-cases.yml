name: Collect Qidian story seed cases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collect-story-cases.yml

permissions:
  contents: write

concurrency:
  group: qidian-story-case-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare directories
        run: |
          rm -rf .case-raw .case-out .case-state
          mkdir -p .case-raw .case-out .case-state

      - name: Collect Qidian ranking anchors
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/qidian-rank-scraper.js \
            --type all \
            --mode mobile \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Bootstrap Chrome profile for hosted runner
        shell: bash
        run: |
          mkdir -p "$HOME/.config/google-chrome/Default"
          printf '{"profile":{"name":"Default"}}\n' > "$HOME/.config/google-chrome/Default/Preferences"
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/story-case-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start browser collection runtime
        shell: bash
        run: |
          npm install -g agent-browser
          node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222

      - name: Expand ranked Qidian books through reader booklists
        shell: bash
        run: |
          pending_args=()
          if [ -f data/story-cases/起点待补简介.jsonl ]; then
            echo "Retrying persisted missing-intro queue first"
            pending_args+=(--pending data/story-cases/起点待补简介.jsonl)
          fi

          set +e
          node skills/story-long-scan/scripts/qidian-booklist-scraper.js \
            --input .case-raw \
            "${pending_args[@]}" \
            --pending-out .case-state/起点待补简介.jsonl \
            --anchors 70 \
            --lists 160 \
            --books 1200 \
            --catalog-lists 80 \
            --min-list-followers 10 \
            --hop2-anchors 40 \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::warning::Qidian booklist expansion failed; ranking cases will still be published"
          fi
          exit 0

      - name: Build cumulative Seed Case pool
        # Seed Case 简介必须至少两句；单句无论多长都由 builder 淘汰。
        shell: bash
        run: |
          inputs=(--input .case-raw)
          if [ -f data/story-cases/榜单数据.md ]; then
            echo "Including historical Case pool"
            inputs+=(--input data/story-cases/榜单数据.md)
          fi
          node skills/story-long-scan/scripts/case-pool-builder.js \
            "${inputs[@]}" \
            --min-chars 80 \
            --outdir .case-out

      - name: Show Case count
        shell: bash
        run: |
          printf 'Markdown cases: '
          grep -c '^## 《' .case-out/榜单数据.md || true
          printf 'JSONL cases: '
          wc -l < .case-out/榜单数据.jsonl
          printf 'Pending intros: '
          if [ -f .case-state/起点待补简介.jsonl ]; then
            awk 'NF {n++} END {print n+0}' .case-state/起点待补简介.jsonl
          else
            echo 0
          fi

      - name: Upload Case artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-seed-cases
          path: |
            .case-out/榜单数据.md
            .case-out/榜单数据.jsonl
            .case-state/起点待补简介.jsonl

      - name: Publish cumulative Case pool to fork
        shell: bash
        run: |
          cp .case-out/榜单数据.md /tmp/榜单数据.md
          cp .case-out/榜单数据.jsonl /tmp/榜单数据.jsonl
          if [ -f .case-state/起点待补简介.jsonl ]; then
            cp .case-state/起点待补简介.jsonl /tmp/起点待补简介.jsonl
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/story-cases
            cp /tmp/榜单数据.md data/story-cases/榜单数据.md
            cp /tmp/榜单数据.jsonl data/story-cases/榜单数据.jsonl
            if [ -f /tmp/起点待补简介.jsonl ]; then
              cp /tmp/起点待补简介.jsonl data/story-cases/起点待补简介.jsonl
            fi
            git add data/story-cases/榜单数据.md data/story-cases/榜单数据.jsonl
            if [ -f data/story-cases/起点待补简介.jsonl ]; then
              git add data/story-cases/起点待补简介.jsonl
            fi

            if git diff --cached --quiet; then
              echo "Case pool and pending queue unchanged"
              exit 0
            fi

            git commit -m "data: refresh cumulative story seed case pool"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; retrying from latest main"
            sleep 2
          done

          echo "::error::Failed to publish Case pool after 3 retries"
          exit 1
