name: Collect male story seed cases

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule 是 best-effort，可能延迟甚至漏触发。
    # 一天给三个触发窗口；最近 18 小时已有完整成功则后续窗口自动空跑，
    # 首轮失败/部分成功则下一窗口自动补跑。
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/collect-story-cases.yml

permissions:
  contents: write

concurrency:
  group: story-case-collection
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate redundant scheduled retry
        id: gate
        shell: bash
        run: |
          should_run=1
          reason="manual/push run"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f data/story-cases/采集状态.json ]; then
            state_values=$(python3 -c 'import json,datetime; p="data/story-cases/采集状态.json"; s=json.load(open(p,encoding="utf-8")); raw=s.get("completed_at") or ""; raw=raw[:-1]+"+00:00" if raw.endswith("Z") else raw; dt=datetime.datetime.fromisoformat(raw) if raw else None; print("1" if s.get("complete") is True else "0", int(dt.timestamp()) if dt else 0)' 2>/dev/null || echo "0 0")
            read -r complete last_epoch <<< "$state_values"
            now_epoch=$(date +%s)
            age=$((now_epoch - last_epoch))
            if [ "$complete" = "1" ] && [ "$last_epoch" -gt 0 ] && [ "$age" -lt 64800 ]; then
              should_run=0
              reason="complete collection exists within 18h (age=${age}s)"
            else
              reason="no fresh complete collection; retry required (complete=${complete}, age=${age}s)"
            fi
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Collection gate: should_run=$should_run — $reason"

      - name: Setup Node
        if: steps.gate.outputs.should_run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare directories
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          rm -rf .case-raw .case-out .case-state
          mkdir -p .case-raw .case-out .case-state
          if [ -f data/story-cases/起点待补简介.jsonl ]; then
            cp data/story-cases/起点待补简介.jsonl .case-state/起点待补简介.jsonl
          fi
          echo "BROWSER_READY=0" >> "$GITHUB_ENV"
          echo "COLLECTION_PARTIAL=0" >> "$GITHUB_ENV"

      - name: Collect Qidian SSR ranking anchors
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/qidian-rank-scraper.js \
            --type all \
            --mode mobile \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Qidian SSR ranking collection was partial (exit $code)"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Bootstrap Chrome profile for hosted runner
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/google-chrome/Default"
          printf '{"profile":{"name":"Default"}}\n' > "$HOME/.config/google-chrome/Default/Preferences"
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/story-case-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start browser collection runtime with bounded retry
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          set +e
          npm install -g agent-browser
          install_code=$?
          if [ "$install_code" -ne 0 ]; then
            echo "::warning::agent-browser install failed; browser sources will be skipped"
            echo "BROWSER_READY=0" >> "$GITHUB_ENV"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Browser start attempt 1/2"
          node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222
          first_code=$?

          if [ "$first_code" -eq 0 ]; then
            echo "BROWSER_READY=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::Chrome CDP first start failed; retrying once with a fresh debug profile"
          echo "Browser start attempt 2/2"
          node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222 --reset --yes
          second_code=$?

          if [ "$second_code" -eq 0 ]; then
            echo "BROWSER_READY=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::Chrome CDP failed twice; continue with browser-independent Qidian SSR data and retry at the next schedule window"
          echo "BROWSER_READY=0" >> "$GITHUB_ENV"
          echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          echo "---- Xvfb log ----"
          tail -n 120 /tmp/story-case-xvfb.log 2>/dev/null || true
          exit 0

      - name: Discover and collect current Qidian ranking catalog
        if: steps.gate.outputs.should_run == '1' && env.BROWSER_READY == '1'
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/qidian-rank-discovery-scraper.js \
            --pages 5 \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Dynamic Qidian ranking expansion was partial (exit $code); next schedule window will retry"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Collect Fanqie male rankings
        if: steps.gate.outputs.should_run == '1' && env.BROWSER_READY == '1'
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/fanqie-rank-scraper.js \
            --channel 1 \
            --type all \
            --top 50 \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Fanqie collection was partial (exit $code); next schedule window will retry"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Collect Ciweimao non-female rankings with full intros
        if: steps.gate.outputs.should_run == '1' && env.BROWSER_READY == '1'
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/ciweimao-rank-scraper.js \
            --type all \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Ciweimao collection was partial (exit $code); next schedule window will retry"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Expand ranked Qidian books through reader booklists
        if: steps.gate.outputs.should_run == '1' && env.BROWSER_READY == '1'
        shell: bash
        run: |
          pending_args=()
          if [ -f data/story-cases/起点待补简介.jsonl ]; then
            echo "Retrying persisted missing-intro queue first"
            pending_args+=(--pending data/story-cases/起点待补简介.jsonl)
          fi

          set +e
          node skills/story-long-scan/scripts/qidian-booklist-scraper.js \
            --input .case-raw \
            "${pending_args[@]}" \
            --pending-out .case-state/起点待补简介.jsonl \
            --anchors 70 \
            --lists 160 \
            --books 1200 \
            --catalog-lists 80 \
            --min-list-followers 10 \
            --hop2-anchors 40 \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Qidian booklist expansion was partial (exit $code); persisted queue is retained"
            echo "COLLECTION_PARTIAL=1" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Show raw source files
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          echo "Raw collection files:"
          find .case-raw -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort || true

      - name: Build cumulative Seed Case pool
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          inputs=(--input .case-raw)
          if [ -f data/story-cases/榜单数据.md ]; then
            echo "Including historical Case pool"
            inputs+=(--input data/story-cases/榜单数据.md)
          fi
          node skills/story-long-scan/scripts/case-pool-builder.js \
            "${inputs[@]}" \
            --min-chars 80 \
            --outdir .case-out

      - name: Record collection state
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          cases=$(wc -l < .case-out/榜单数据.jsonl)
          pending=0
          if [ -f .case-state/起点待补简介.jsonl ]; then
            pending=$(awk 'NF {n++} END {print n+0}' .case-state/起点待补简介.jsonl)
          fi

          complete=true
          if [ "$BROWSER_READY" != "1" ] || [ "$COLLECTION_PARTIAL" = "1" ]; then
            complete=false
          fi

          COMPLETE="$complete" CASES="$cases" PENDING="$pending" BROWSER="$BROWSER_READY" PARTIAL="$COLLECTION_PARTIAL" python3 -c 'import json,os,datetime; state={"completed_at":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),"complete":os.environ["COMPLETE"].lower()=="true","cases":int(os.environ["CASES"]),"pending_qidian_intros":int(os.environ["PENDING"]),"browser_ready":os.environ["BROWSER"]=="1","partial":os.environ["PARTIAL"]=="1","run_id":os.environ.get("GITHUB_RUN_ID","")}; f=open(".case-state/采集状态.json","w",encoding="utf-8"); json.dump(state,f,ensure_ascii=False,indent=2); f.write(chr(10)); f.close(); print(json.dumps(state,ensure_ascii=False))'

      - name: Show Case count
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          printf 'Markdown cases: '
          grep -c '^## 《' .case-out/榜单数据.md || true
          printf 'JSONL cases: '
          wc -l < .case-out/榜单数据.jsonl
          printf 'Pending Qidian intros: '
          if [ -f .case-state/起点待补简介.jsonl ]; then
            awk 'NF {n++} END {print n+0}' .case-state/起点待补简介.jsonl
          else
            echo 0
          fi
          printf 'Collection complete: '
          python3 -c 'import json; print(json.load(open(".case-state/采集状态.json", encoding="utf-8"))["complete"])'

      - name: Upload Case artifact
        if: steps.gate.outputs.should_run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: story-seed-cases
          path: |
            .case-out/榜单数据.md
            .case-out/榜单数据.jsonl
            .case-state/起点待补简介.jsonl
            .case-state/采集状态.json

      - name: Publish cumulative Case pool to fork
        if: steps.gate.outputs.should_run == '1'
        shell: bash
        run: |
          cp .case-out/榜单数据.md /tmp/榜单数据.md
          cp .case-out/榜单数据.jsonl /tmp/榜单数据.jsonl
          cp .case-state/采集状态.json /tmp/采集状态.json
          if [ -f .case-state/起点待补简介.jsonl ]; then
            cp .case-state/起点待补简介.jsonl /tmp/起点待补简介.jsonl
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/story-cases
            cp /tmp/榜单数据.md data/story-cases/榜单数据.md
            cp /tmp/榜单数据.jsonl data/story-cases/榜单数据.jsonl
            cp /tmp/采集状态.json data/story-cases/采集状态.json
            if [ -f /tmp/起点待补简介.jsonl ]; then
              cp /tmp/起点待补简介.jsonl data/story-cases/起点待补简介.jsonl
            fi

            git add \
              data/story-cases/榜单数据.md \
              data/story-cases/榜单数据.jsonl \
              data/story-cases/采集状态.json
            if [ -f data/story-cases/起点待补简介.jsonl ]; then
              git add data/story-cases/起点待补简介.jsonl
            fi

            git commit -m "data: refresh cumulative story seed case pool"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; retrying from latest main"
            sleep 2
          done

          echo "::error::Failed to publish Case pool after 3 retries"
          exit 1
