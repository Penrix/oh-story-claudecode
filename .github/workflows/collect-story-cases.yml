name: Collect story seed cases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collect-story-cases.yml

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare directories
        run: |
          rm -rf .case-raw .case-out
          mkdir -p .case-raw .case-out

      - name: Collect Qidian ranking anchors
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/qidian-rank-scraper.js \
            --type all \
            --mode mobile \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Bootstrap Chrome profile for hosted runner
        shell: bash
        run: |
          mkdir -p "$HOME/.config/google-chrome/Default"
          printf '{"profile":{"name":"Default"}}\n' > "$HOME/.config/google-chrome/Default/Preferences"
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/story-case-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start browser collection runtime
        shell: bash
        run: |
          npm install -g agent-browser
          node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222

      - name: Collect Fanqie and Qimao ranking anchors
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/fanqie-rank-scraper.js \
            --channel 1 \
            --type all \
            --top 20 \
            --outdir .case-raw
          fanqie_code=$?

          node skills/story-long-scan/scripts/qimao-rank-scraper.js \
            --channel male \
            --type all \
            --period all \
            --outdir .case-raw
          qimao_code=$?
          set -e

          echo "Fanqie exit: $fanqie_code"
          echo "Qimao exit: $qimao_code"
          # 0=完整成功，2=部分成功；两者都保留已采到的数据。
          if [ "$fanqie_code" -ne 0 ] && [ "$fanqie_code" -ne 2 ]; then
            echo "::warning::Fanqie ranking collection failed"
          fi
          if [ "$qimao_code" -ne 0 ] && [ "$qimao_code" -ne 2 ]; then
            echo "::warning::Qimao ranking collection failed"
          fi
          exit 0

      - name: Expand ranked Qidian books through reader booklists
        shell: bash
        run: |
          set +e
          node skills/story-long-scan/scripts/qidian-booklist-scraper.js \
            --input .case-raw \
            --anchors 30 \
            --lists 60 \
            --books 600 \
            --outdir .case-raw
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::warning::Qidian booklist expansion failed; ranking cases will still be published"
          fi
          exit 0

      - name: Build cumulative Seed Case pool
        shell: bash
        run: |
          inputs=(--input .case-raw)
          if [ -f data/story-cases/榜单数据.md ]; then
            echo "Including historical Case pool"
            inputs+=(--input data/story-cases/榜单数据.md)
          fi
          node skills/story-long-scan/scripts/case-pool-builder.js \
            "${inputs[@]}" \
            --min-chars 80 \
            --outdir .case-out

      - name: Show Case count
        shell: bash
        run: |
          printf 'Markdown cases: '
          grep -c '^## 《' .case-out/榜单数据.md || true
          printf 'JSONL cases: '
          wc -l < .case-out/榜单数据.jsonl

      - name: Upload Case artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-seed-cases
          path: |
            .case-out/榜单数据.md
            .case-out/榜单数据.jsonl

      - name: Publish cumulative Case pool to fork
        shell: bash
        run: |
          cp .case-out/榜单数据.md /tmp/榜单数据.md
          cp .case-out/榜单数据.jsonl /tmp/榜单数据.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/story-cases
            cp /tmp/榜单数据.md data/story-cases/榜单数据.md
            cp /tmp/榜单数据.jsonl data/story-cases/榜单数据.jsonl
            git add data/story-cases/榜单数据.md data/story-cases/榜单数据.jsonl

            if git diff --cached --quiet; then
              echo "Case pool unchanged"
              exit 0
            fi

            git commit -m "data: refresh cumulative story seed case pool"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; retrying from latest main"
            sleep 2
          done

          echo "::error::Failed to publish Case pool after 3 retries"
          exit 1
